<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Product Dashboard</title>
    <!-- Checkpoint 1: Aktifkan Tailwind Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 text-slate-900">

    <!-- Checkpoint 8: Navbar Dirakit dari Utilities -->
    <nav class="bg-slate-900 text-white">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="#" class="font-bold text-lg">ProductLab</a>
            <div class="flex gap-5 text-sm">
                <a href="#" class="hover:text-blue-300">Dashboard</a>
                <a href="#products" class="hover:text-blue-300">Products</a>
                <a href="#table" class="hover:text-blue-300">Inventory</a>
            </div>
        </div>
    </nav>

    <!-- Checkpoint 3 & 11: Container Main Dashboard -->
    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- Notification Toast -->
        <div id="alertBox" class="hidden"></div>

        <!-- Checkpoint 4 & 7: Flexbox Dashboard Header -->
        <div class="flex items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold">Product Dashboard</h1>
                <p class="mt-2 text-slate-500">Kelola tampilan produk.</p>
            </div>
            <a href="#form-section" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 transition">
                + Tambah Product
            </a>
        </div>

        <!-- Checkpoint 5: Grid Statistik + Responsive Prefix -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-sm text-slate-500">Total Product</p>
                <p id="totalProductStat" class="mt-2 text-2xl font-bold">-</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-sm text-slate-500">Stock Ready</p>
                <p id="stockReadyStat" class="mt-2 text-2xl font-bold">-</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-sm text-slate-500">Categories</p>
                <p id="categoriesStat" class="mt-2 text-2xl font-bold">-</p>
            </div>
        </section>

        <!-- Checkpoint 6: Product Cards -->
        <section id="products" class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold">Products</h2>
                <a href="#table" class="text-sm font-semibold text-blue-600 hover:text-blue-800">
                    Lihat semua
                </a>
            </div>
            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Rendered dynamically by AJAX -->
            </div>
        </section>

        <!-- Checkpoint 9: Responsive Table -->
        <section id="table" class="mb-8">
            <h2 class="text-xl font-bold mb-4">Inventory</h2>
            <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 text-slate-600">
                        <tr>
                            <th class="px-4 py-3">Product</th>
                            <th class="px-4 py-3">Category</th>
                            <th class="px-4 py-3">Price</th>
                            <th class="px-4 py-3">Stock</th>
                            <th class="px-4 py-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <!-- Rendered dynamically by AJAX -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Checkpoint 10: Form dengan Utility + Focus State -->
        <section id="form-section" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
            <h2 class="text-xl font-bold mb-5">Add Product</h2>
            <form id="addProductForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">
                        Product Name
                    </label>
                    <input type="text"
                           id="inputName"
                           name="title"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500"
                           placeholder="Mechanical Keyboard"
                           required
                    >
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">
                        Category
                    </label>
                    <select id="inputCategory" name="category" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200">
                        <option value="Elektronik">Elektronik</option>
                        <option value="Aksesoris">Aksesoris</option>
                        <option value="Furniture">Furniture</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Price</label>
                    <input type="number" id="inputPrice" name="price" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500" placeholder="550000" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Stock</label>
                    <input type="number" id="inputStock" name="stock" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500" placeholder="10" required>
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="px-5 py-2.5 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 focus:ring-2 focus:ring-blue-300 transition cursor-pointer">
                        Save Product
                    </button>
                </div>
            </form>
        </section>
    </main>

    <!-- Modal Detail Product -->
    <div id="detailModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative animate-in fade-in duration-150">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold cursor-pointer">
                &times;
            </button>
            <div id="detailModalContent"></div>
            <div class="mt-6 flex justify-end">
                <button onclick="closeDetailModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-lg transition cursor-pointer">
                    Tutup
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-200 py-6 text-center text-sm text-slate-500">
        <p>&copy; 2026 ProductLab - Tailwind CSS Fundamentals (Module 11D)</p>
    </footer>

    <!-- AJAX Client Script -->
    <script src="app.js"></script>
</body>
</html>
